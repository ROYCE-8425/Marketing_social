services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dxos}
      POSTGRES_USER: ${POSTGRES_USER:-dxos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dxos} -d ${POSTGRES_DB:-dxos}"]
      interval: 2s
      timeout: 3s
      retries: 10

  dxos-api:
    image: dxos-api:0.1.0-spike
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-dxos};Username=${POSTGRES_USER:-dxos};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      Database__AutoMigrate: "true"
      EngineeringSmoke__Enabled: "true"
      ASPNETCORE_ENVIRONMENT: "Development"
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      FACEBOOK_VERIFY_TOKEN: ${FACEBOOK_VERIFY_TOKEN:-dxos_marketing_verify_token_2026}
      FACEBOOK_MODE: ${FACEBOOK_MODE:-mock}
      ZALO_APP_ID: ${ZALO_APP_ID:-}
      ZALO_APP_SECRET: ${ZALO_APP_SECRET:-}
      ZALO_OA_ID: ${ZALO_OA_ID:-}
      ZALO_OA_ACCESS_TOKEN: ${ZALO_OA_ACCESS_TOKEN:-}
      ZALO_OA_SECRET: ${ZALO_OA_SECRET:-}
      ZALO_MODE: ${ZALO_MODE:-mock}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
